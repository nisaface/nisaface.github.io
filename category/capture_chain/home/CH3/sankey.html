<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IDeATe Minor Enrollment by College</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        padding: 16px;
        background-color: #f0ebe3;
        background-image:
          repeating-linear-gradient(
            135deg,
            transparent 0px,
            transparent 32px,
            rgba(196, 19, 48, 0.07) 32px,
            rgba(196, 19, 48, 0.07) 46px,
            rgba(0, 100, 50, 0.05) 46px,
            rgba(0, 100, 50, 0.05) 54px,
            transparent 54px,
            transparent 58px,
            rgba(180, 130, 0, 0.07) 58px,
            rgba(180, 130, 0, 0.07) 61px,
            rgba(0, 120, 170, 0.05) 61px,
            rgba(0, 120, 170, 0.05) 64px,
            rgba(20, 55, 130, 0.04) 64px,
            rgba(20, 55, 130, 0.04) 72px,
            transparent 72px,
            transparent 100px
          ),
          repeating-linear-gradient(
            45deg,
            #f0ebe3 0px,
            #f0ebe3 32px,
            rgba(196, 19, 48, 0.07) 32px,
            rgba(196, 19, 48, 0.07) 46px,
            rgba(0, 100, 50, 0.05) 46px,
            rgba(0, 100, 50, 0.05) 54px,
            #f0ebe3 54px,
            #f0ebe3 58px,
            rgba(180, 130, 0, 0.07) 58px,
            rgba(180, 130, 0, 0.07) 61px,
            rgba(0, 120, 170, 0.05) 61px,
            rgba(0, 120, 170, 0.05) 64px,
            rgba(20, 55, 130, 0.04) 64px,
            rgba(20, 55, 130, 0.04) 72px,
            #f0ebe3 72px,
            #f0ebe3 100px
          );
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: flex-start;
      }

      .card {
        width: 100%;
        max-width: 980px;
        overflow: hidden;
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.12);
      }

      .gold-bar {
        height: 4px;
        background: #fdb515;
      }

      /* Header: solid CMU red with tartan texture */
      .hdr {
        background-color: #c41330;
        background-image:
          repeating-linear-gradient(
            0deg,
            transparent,
            transparent 17px,
            rgba(253, 181, 21, 0.18) 17px,
            rgba(253, 181, 21, 0.18) 20px
          ),
          repeating-linear-gradient(
            90deg,
            transparent,
            transparent 17px,
            rgba(253, 181, 21, 0.18) 17px,
            rgba(253, 181, 21, 0.18) 20px
          ),
          repeating-linear-gradient(
            0deg,
            transparent,
            transparent 5px,
            rgba(4, 54, 115, 0.12) 5px,
            rgba(4, 54, 115, 0.12) 7px
          ),
          repeating-linear-gradient(
            90deg,
            transparent,
            transparent 5px,
            rgba(4, 54, 115, 0.12) 5px,
            rgba(4, 54, 115, 0.12) 7px
          );
        padding: 22px 28px 18px;
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        border-bottom: 1px solid rgba(0, 0, 0, 0.1);
      }

      .hdr-title {
        font-family: "Times New Roman", Georgia, serif;
        font-size: 21px;
        font-weight: bold;
        color: #fff;
        line-height: 1.25;
      }
      .hdr-sub {
        font-family: "Space Mono", "SF Mono", "Courier New", monospace;
        font-size: 8.5px;
        color: rgba(255, 255, 255, 0.65);
        margin-top: 8px;
        letter-spacing: 1.4px;
        text-transform: uppercase;
      }
      .hdr-stat {
        text-align: right;
      }
      .hdr-n {
        font-family: "Space Mono", "SF Mono", "Courier New", monospace;
        font-size: 42px;
        font-weight: 700;
        color: #fdb515;
        line-height: 1;
      }
      .hdr-nl {
        font-family: "Space Mono", "SF Mono", "Courier New", monospace;
        font-size: 8px;
        color: rgba(255, 255, 255, 0.65);
        letter-spacing: 1.4px;
        text-transform: uppercase;
        margin-top: 4px;
      }

      .chart-wrap {
        background: #ffffff;
        padding: 20px 8px 16px;
      }
      #sankey {
        display: block;
        width: 100%;
      }
      .lnk {
        opacity: 0;
        transition: opacity 0.6s ease;
      }
      .lnk.show {
        opacity: 0.32;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="gold-bar"></div>
      <div class="hdr">
        <div>
          <div class="hdr-title">IDeATe Minor Enrollment by College</div>
          <div class="hdr-sub">
            Home College &nbsp;·&nbsp; IDeATe Minor &nbsp;·&nbsp; Undergraduate
            Students
          </div>
        </div>
        <div class="hdr-stat">
          <div class="hdr-n">260</div>
          <div class="hdr-nl">Students</div>
        </div>
      </div>
      <div class="chart-wrap">
        <svg id="sankey"></svg>
      </div>
      <div class="gold-bar"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
    <script>
      // ── Palette (saturated for white background) ──────────────────────────────────
      const CC = {
        CFA: "#0070c0",
        CMU: "#c41330",
        DC: "#007a6e",
        SCS: "#b08800",
        CIT: "#b85000",
        MCS: "#006e38",
        TSB: "#6a1ab0",
        HC: "#1a48b0",
      };
      // Minor endpoint colors = host college color
      const MC = {
        GAMEDESG: "#c41330", // CMU
        ANIMSE: "#b08800", // SCS
        INNENT: "#6a1ab0", // TSB
        PHYCOMP: "#b08800", // SCS
        MEDDES: "#0070c0", // CFA
        SOFTEC: "#b08800", // SCS
        INTELENV: "#b08800", // SCS
        SONICART: "#0070c0", // CFA
        DESLEARN: "#b08800", // SCS
        ITAC: "#007a6e", // DC
      };

      // ── Full names ────────────────────────────────────────────────────────────────
      const CNAMES = {
        CFA: ["College of Fine Arts"],
        CMU: ["Carnegie Mellon", "University"],
        DC: ["Dietrich College", "of H&SS"],
        SCS: ["School of Computer", "Science"],
        CIT: ["Carnegie Institute", "of Technology"],
        MCS: ["Mellon College", "of Science"],
        TSB: ["Tepper School", "of Business"],
        HC: ["Heinz College"],
      };
      const MNAMES = {
        GAMEDESG: ["Game Design"],
        ANIMSE: ["Animation &", "Special Effects"],
        INNENT: ["Innovation &", "Entrepreneurship"],
        PHYCOMP: ["Physical Computing"],
        MEDDES: ["Media Design"],
        SOFTEC: ["Soft Technologies"],
        INTELENV: ["Intelligent", "Environments"],
        SONICART: ["Sonic Arts"],
        DESLEARN: ["Design for Learning"],
        ITAC: ["Immersive Technologies"],
      };

      // ── Nodes ─────────────────────────────────────────────────────────────────────
      const lN = [
        { id: "CFA", v: 115 },
        { id: "CMU", v: 34 },
        { id: "SCS", v: 25 },
        { id: "DC", v: 24 },
        { id: "CIT", v: 22 },
        { id: "MCS", v: 15 },
        { id: "TSB", v: 15 },
        { id: "HC", v: 3 },
      ];
      const rN = [
        { id: "GAMEDESG", lbl: 74 },
        { id: "ANIMSE", lbl: 39 },
        { id: "INNENT", lbl: 38 },
        { id: "PHYCOMP", lbl: 29 },
        { id: "MEDDES", lbl: 19 },
        { id: "SOFTEC", lbl: 18 },
        { id: "INTELENV", lbl: 18 },
        { id: "SONICART", lbl: 6 },
        { id: "DESLEARN", lbl: 6 },
        { id: "ITAC", lbl: 6 },
      ];

      // ── Links [src, tgt, val] ─────────────────────────────────────────────────────
      const RL = [
        ["CFA", "GAMEDESG", 32],
        ["CFA", "ANIMSE", 25],
        ["CFA", "INNENT", 14],
        ["CFA", "PHYCOMP", 10],
        ["CFA", "MEDDES", 10],
        ["CFA", "INTELENV", 7],
        ["CFA", "SOFTEC", 6],
        ["CFA", "SONICART", 5],
        ["CFA", "DESLEARN", 4],
        ["CFA", "ITAC", 2],
        ["CMU", "GAMEDESG", 10],
        ["CMU", "ANIMSE", 8],
        ["CMU", "INNENT", 6],
        ["CMU", "PHYCOMP", 3],
        ["CMU", "MEDDES", 2],
        ["CMU", "SOFTEC", 2],
        ["CMU", "INTELENV", 2],
        ["CMU", "SONICART", 1],
        ["SCS", "GAMEDESG", 9],
        ["SCS", "INNENT", 5],
        ["SCS", "PHYCOMP", 4],
        ["SCS", "SOFTEC", 4],
        ["SCS", "INTELENV", 2],
        ["SCS", "ITAC", 1],
        ["DC", "INNENT", 8],
        ["DC", "GAMEDESG", 5],
        ["DC", "ANIMSE", 4],
        ["DC", "PHYCOMP", 2],
        ["DC", "MEDDES", 2],
        ["DC", "SOFTEC", 1],
        ["DC", "INTELENV", 1],
        ["DC", "DESLEARN", 1],
        ["CIT", "PHYCOMP", 6],
        ["CIT", "GAMEDESG", 5],
        ["CIT", "SOFTEC", 4],
        ["CIT", "INTELENV", 3],
        ["CIT", "MEDDES", 2],
        ["CIT", "ITAC", 2],
        ["MCS", "PHYCOMP", 4],
        ["MCS", "GAMEDESG", 3],
        ["MCS", "INNENT", 2],
        ["MCS", "MEDDES", 2],
        ["MCS", "SOFTEC", 2],
        ["MCS", "INTELENV", 1],
        ["MCS", "ITAC", 1],
        ["TSB", "GAMEDESG", 8],
        ["TSB", "INNENT", 3],
        ["TSB", "ANIMSE", 2],
        ["TSB", "SOFTEC", 1],
        ["TSB", "INTELENV", 1],
        ["HC", "INNENT", 1],
        ["HC", "DESLEARN", 1],
        ["HC", "INTELENV", 1],
      ];

      // ── Compute right node heights from link sums ─────────────────────────────────
      const rMap = Object.fromEntries(rN.map((n) => [n.id, n]));
      rN.forEach((n) => (n.v = 0));
      RL.forEach(([, t, v]) => {
        rMap[t].v += v;
      });

      // ── Layout ────────────────────────────────────────────────────────────────────
      const W = 960,
        H = 720,
        nW = 16,
        pad = 9;
      const mg = { t: 50, r: 168, b: 18, l: 168 };
      const iW = W - mg.l - mg.r,
        iH = H - mg.t - mg.b;

      const lTot = lN.reduce((s, n) => s + n.v, 0);
      const rTot = rN.reduce((s, n) => s + n.v, 0);
      const lPad = (lN.length - 1) * pad,
        rPad = (rN.length - 1) * pad;
      const scale = (iH - Math.max(lPad, rPad)) / Math.max(lTot, rTot);

      const lMap = Object.fromEntries(lN.map((n) => [n.id, n]));
      let ly = (iH - (lTot * scale + lPad)) / 2;
      lN.forEach((n) => {
        n.h = n.v * scale;
        n.y = ly;
        n.sOff = 0;
        ly += n.h + pad;
      });

      let ry = (iH - (rTot * scale + rPad)) / 2;
      rN.forEach((n) => {
        n.h = n.v * scale;
        n.y = ry;
        n.tOff = 0;
        ry += n.h + pad;
      });

      const lOrd = Object.fromEntries(lN.map((n, i) => [n.id, i]));
      const rOrd = Object.fromEntries(rN.map((n, i) => [n.id, i]));

      const links = [...RL]
        .sort((a, b) => {
          const d = lOrd[a[0]] - lOrd[b[0]];
          return d || rOrd[a[1]] - rOrd[b[1]];
        })
        .map(([s, t, v]) => {
          const sn = lMap[s],
            tn = rMap[t],
            h = v * scale;
          const sy1 = sn.y + sn.sOff;
          sn.sOff += h;
          const ty1 = tn.y + tn.tOff;
          tn.tOff += h;
          return { s, t, v, sy1, sy2: sy1 + h, ty1, ty2: ty1 + h, col: CC[s] };
        });

      // ── SVG ───────────────────────────────────────────────────────────────────────
      const svg = d3
        .select("#sankey")
        .attr("viewBox", `0 0 ${W} ${H}`)
        .attr("width", "100%");

      const defs = svg.append("defs");

      // Drop shadow filter for nodes (lighter for white bg)
      const gf = defs
        .append("filter")
        .attr("id", "ng")
        .attr("x", "-20%")
        .attr("y", "-20%")
        .attr("width", "140%")
        .attr("height", "140%");
      gf.append("feDropShadow")
        .attr("dx", 0)
        .attr("dy", 1)
        .attr("stdDeviation", 2)
        .attr("flood-color", "rgba(0,0,0,.18)")
        .attr("flood-opacity", 1);

      const g = svg.append("g").attr("transform", `translate(${mg.l},${mg.t})`);

      // White chart background with light grid
      g.append("rect")
        .attr("width", iW)
        .attr("height", iH)
        .attr("fill", "#ffffff")
        .attr("rx", 2)
        .attr("stroke", "#e8e4df")
        .attr("stroke-width", 1);
      for (let i = 1; i < 7; i++) {
        g.append("line")
          .attr("x1", (iW * i) / 7)
          .attr("y1", 0)
          .attr("x2", (iW * i) / 7)
          .attr("y2", iH)
          .attr("stroke", "rgba(0,0,0,.04)")
          .attr("stroke-width", 1);
      }

      // Links
      const linkEls = links.map(({ sy1, sy2, ty1, ty2, col }) => {
        const x1 = nW,
          x2 = iW - nW,
          cx = x1 + (x2 - x1) * 0.5;
        return g
          .append("path")
          .attr("class", "lnk")
          .attr(
            "d",
            `M${x1},${sy1}C${cx},${sy1} ${cx},${ty1} ${x2},${ty1}L${x2},${ty2}C${cx},${ty2} ${cx},${sy2} ${x1},${sy2}Z`,
          )
          .attr("fill", col);
      });
      linkEls.forEach((el, i) =>
        setTimeout(() => el.classed("show", true), 100 + i * 10),
      );

      // ── Label renderer ────────────────────────────────────────────────────────────
      const FF = "'Space Mono','SF Mono','Fira Code','Courier New',monospace";

      function txt(x, y, content, size, weight, fill, anchor) {
        g.append("text")
          .attr("x", x)
          .attr("y", y)
          .attr("text-anchor", anchor)
          .attr("dominant-baseline", "middle")
          .attr("font-size", size)
          .attr("font-family", FF)
          .attr("font-weight", weight)
          .attr("fill", fill)
          .text(content);
      }

      function renderLabel(x, y, h, nameLines, countVal, anchor) {
        const my = y + h / 2;
        const NAME = "#1a1a2e";
        const COUNT = "rgba(60,80,120,.6)";
        const cnt = String(countVal);

        if (h < 14) {
          txt(x, my - 5, nameLines[0], 8, "700", NAME, anchor);
          txt(x, my + 5, cnt, 8, "700", COUNT, anchor);
        } else if (h < 26) {
          txt(x, my - 5, nameLines[0], 9, "700", NAME, anchor);
          txt(x, my + 6, cnt, 8, "700", COUNT, anchor);
        } else if (nameLines.length >= 2) {
          txt(x, my - 11, nameLines[0], 9, "700", NAME, anchor);
          txt(x, my, nameLines[1], 9, "700", NAME, anchor);
          txt(x, my + 11, cnt, 8, "700", COUNT, anchor);
        } else {
          txt(x, my - 6, nameLines[0], 9, "700", NAME, anchor);
          txt(x, my + 5, cnt, 8, "700", COUNT, anchor);
        }
      }

      // ── Draw left nodes ───────────────────────────────────────────────────────────
      lN.forEach((n) => {
        g.append("rect")
          .attr("x", 0)
          .attr("y", n.y)
          .attr("width", nW)
          .attr("height", n.h)
          .attr("fill", CC[n.id])
          .attr("rx", 1)
          .attr("filter", "url(#ng)");
        renderLabel(-12, n.y, n.h, CNAMES[n.id], n.v, "end");
      });

      // ── Draw right nodes ──────────────────────────────────────────────────────────
      rN.forEach((n) => {
        g.append("rect")
          .attr("x", iW - nW)
          .attr("y", n.y)
          .attr("width", nW)
          .attr("height", n.h)
          .attr("fill", MC[n.id])
          .attr("rx", 1)
          .attr("filter", "url(#ng)");
        renderLabel(iW + 12, n.y, n.h, MNAMES[n.id], n.lbl, "start");
      });

      // ── Column headers ────────────────────────────────────────────────────────────
      ["HOME COLLEGE", "IDeATe MINOR"].forEach((lbl, i) => {
        g.append("text")
          .attr("x", i === 0 ? nW / 2 : iW - nW / 2)
          .attr("y", -24)
          .attr("text-anchor", "middle")
          .attr("font-size", 11)
          .attr("font-family", FF)
          .attr("font-weight", "700")
          .attr("fill", "#c41330")
          .attr("letter-spacing", 2)
          .text(lbl);
      });
    </script>
  </body>
</html>
